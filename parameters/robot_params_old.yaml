  disc_gap_m: 0.0056

  disc_spacing_m: 0.0096

  central_hole_diameter_m: 0.002

  actuation_hole_diameter_m: 0.0008

  tendon_radius_m: 0.00338


motors:

  step_angle_deg: 0.18

  torque_kg_cm: 5.0

  torque_Nm: 0.4903325

